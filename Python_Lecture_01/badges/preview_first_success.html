<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>첫 성공 배지 시안</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66717f;
      --line: #d6dde6;
      --paper: #f5f7fa;
      --accent: #0f766e;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 15% -10%, #e6f4f1 0%, transparent 60%),
        radial-gradient(900px 420px at 110% 10%, #e8eefc 0%, transparent 55%),
        var(--paper);
    }

    .preview {
      width: min(520px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      align-items: end;
      gap: 24px;
    }

    .sample {
      display: grid;
      gap: 8px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .sample img {
      display: block;
      filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14));
    }
  </style>
</head>
<body>
  <main class="preview">
    <h1>첫 성공</h1>
    <p>코드를 실행해서 처음 통과한 순간을 위한 차분한 학습 스탬프 시안입니다.</p>
    <div class="row">
      <div class="sample">
        <img src="badge_first_success.svg" width="56" height="56" alt="첫 성공 배지 56px">
        <span>actual 56px</span>
      </div>
      <div class="sample">
        <img src="badge_first_success.svg" width="80" height="80" alt="첫 성공 배지 80px">
        <span>large preview</span>
      </div>
    </div>
  </main>
</body>
</html>
