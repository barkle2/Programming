<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배지 디자인 시안</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66717f;
      --line: #d6dde6;
      --paper: #f5f7fa;
      --panel: #ffffff;
      --accent: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 15% -10%, #e6f4f1 0%, transparent 60%),
        radial-gradient(900px 420px at 110% 10%, #e8eefc 0%, transparent 55%),
        var(--paper);
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 18px;
    }

    .badge {
      min-height: 112px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 9px;
      padding: 14px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .badge img {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.14));
    }

    .badge span {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>학습 성취 배지</h1>
    <p>작은 학습 스탬프 톤으로 맞춘 전체 배지 시안입니다.</p>
    <section class="grid" aria-label="배지 시안 목록">
      <div class="badge"><img src="badge_first_success.svg" alt="첫 성공"><span>첫 성공</span></div>
      <div class="badge"><img src="badge_streak_3.svg" alt="3회 연속 성공"><span>3회 연속 성공</span></div>
      <div class="badge"><img src="badge_streak_5.svg" alt="5회 연속 성공"><span>5회 연속 성공</span></div>
      <div class="badge"><img src="badge_streak_7.svg" alt="7회 연속 성공"><span>7회 연속 성공</span></div>
      <div class="badge"><img src="badge_iron_will_1.svg" alt="불굴의 의지 I"><span>불굴의 의지 I</span></div>
      <div class="badge"><img src="badge_iron_will_2.svg" alt="불굴의 의지 II"><span>불굴의 의지 II</span></div>
      <div class="badge"><img src="badge_iron_will_3.svg" alt="불굴의 의지 III"><span>불굴의 의지 III</span></div>
      <div class="badge"><img src="badge_first_window.svg" alt="첫 창 완성"><span>첫 창 완성</span></div>
      <div class="badge"><img src="badge_lesson1_complete.svg" alt="Lesson 1 완성자"><span>Lesson 1 완성자</span></div>
      <div class="badge"><img src="badge_lesson2_complete.svg" alt="Lesson 2 완성자"><span>Lesson 2 완성자</span></div>
      <div class="badge"><img src="badge_lesson3_complete.svg" alt="Lesson 3 완성자"><span>Lesson 3 완성자</span></div>
      <div class="badge"><img src="badge_lesson4_complete.svg" alt="Lesson 4 완성자"><span>Lesson 4 완성자</span></div>
    </section>
  </main>
</body>
</html>
