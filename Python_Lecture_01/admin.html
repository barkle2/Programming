<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학습 현황 대시보드</title>
  <style>
    :root {
      --ink: #17212b; --muted: #66717f; --line: #d6dde6;
      --paper: #f5f7fa; --panel: #fff; --accent: #0f766e; --ok: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px 24px; background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 20px; }
    .refresh-note { font-size: 13px; color: var(--muted); }
    main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }

    .gate { max-width: 360px; margin: 80px auto; padding: 28px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .gate h2 { margin-top: 0; }
    .gate input { width: 100%; height: 42px; padding: 0 12px; margin: 8px 0 12px;
      border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    .gate button, .reload-btn {
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer; }
    .gate .err { color: #b91c1c; font-size: 13px; min-height: 18px; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .card { padding: 16px 18px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; }
    .card span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .card strong { font-size: 30px; }
    .card .sub { font-size: 13px; color: var(--muted); font-weight: 400; }

    .section-title { margin: 18px 0 10px; font-size: 15px; }
    .lesson-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .lesson-chip { padding: 6px 12px; border-radius: 999px; background: #e8f2ff;
      color: #1d4f83; font-size: 13px; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 14px;
      border-bottom: 1px solid var(--line); }
    th { background: #eef2f6; font-size: 12px; color: var(--muted); text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: #c2c9d2; margin-right: 6px; vertical-align: middle; }
    .dot.online { background: var(--ok); box-shadow: 0 0 0 3px rgba(21,128,61,0.15); }
    .bar { position: relative; height: 8px; width: 120px; background: #e5e7eb;
      border-radius: 999px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
    .prog-text { margin-left: 8px; font-size: 13px; color: var(--muted); }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .logout { font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <h2>관리자 토큰</h2>
    <p style="color:var(--muted);font-size:14px;margin-top:0">대시보드를 보려면 서버에 설정된 토큰을 입력하세요.</p>
    <input type="password" id="tokenInput" placeholder="토큰" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button id="tokenBtn">확인</button>
  </div>

  <div id="dashboard" hidden>
    <header>
      <h1>학습 현황 대시보드</h1>
      <div>
        <span class="refresh-note" id="refreshNote">자동 새로고침 중…</span>
        <button class="logout" id="logoutBtn">토큰 변경</button>
      </div>
    </header>
    <main>
      <div class="cards">
        <div class="card"><span>총 사용자</span><strong id="totalUsers">0</strong></div>
        <div class="card"><span>현재 접속 중</span><strong id="activeUsers">0</strong>
          <div class="sub" id="activeNote"></div></div>
        <div class="card"><span>완료한 레슨 합계</span><strong id="lessonsDone">0</strong></div>
      </div>

      <div class="section-title">레슨별 인원 (현재 위치 기준)</div>
      <div class="lesson-chips" id="lessonChips"></div>

      <div class="section-title">사용자 목록</div>
      <table>
        <thead>
          <tr>
            <th>상태</th><th>이름</th><th>이메일</th><th>현재 레슨</th>
            <th>진도</th><th>완료 레슨</th><th>마지막 활동</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
      <div class="empty" id="emptyMsg" hidden>아직 접속한 사용자가 없습니다.</div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
