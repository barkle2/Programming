<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 편집기</title>
  <link rel="stylesheet" href="lec_calc.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Editor</p>
      <h1>강의 편집기</h1>
    </div>
    <div class="editor-header-actions">
      <label class="lesson-select-label">강의
        <select id="lessonSelect">
          <option value="1">Lesson 1</option>
          <option value="2">Lesson 2</option>
          <option value="3">Lesson 3</option>
          <option value="4">Lesson 4</option>
        </select>
      </label>
      <span id="saveStatus"></span>
      <a href="lec_calc.html" class="back-link">← 학습 앱</a>
      <button type="button" id="saveBtn">저장</button>
    </div>
  </header>

  <main class="editor-shell">
    <aside class="editor-nav">
      <div class="panel-head">
        <h2>단계 목록</h2>
        <button type="button" id="addStepBtn">+ 추가</button>
      </div>

      <div class="lesson-meta-fields">
        <label>강의 제목
          <input type="text" id="fCourseTitle">
        </label>
        <label>학습 목표
          <textarea id="fLessonGoal" rows="2"></textarea>
        </label>
      </div>

      <ol id="stepList"></ol>
    </aside>

    <section class="editor-form-panel" id="editorPanel">
      <div class="empty-state">단계를 선택하면 여기서 편집할 수 있어요.</div>

      <form id="stepForm" hidden>
        <div class="form-topbar">
          <h2 id="formStepId"></h2>
          <button type="button" id="deleteStepBtn" class="danger-btn">단계 삭제</button>
        </div>

        <div class="form-section">
          <h3>기본 정보</h3>
          <label>ID
            <input type="text" id="fId">
          </label>
          <label>제목
            <input type="text" id="fTitle">
          </label>
          <label>개념 태그 <span class="field-hint">쉼표로 구분</span>
            <input type="text" id="fConcepts" placeholder="import, module, alias">
          </label>
        </div>

        <div class="form-section">
          <h3>학습 내용</h3>
          <label>설명
            <textarea id="fExplanation" class="auto-resize" rows="5"></textarea>
          </label>
          <label>미션
            <textarea id="fMission" class="auto-resize" rows="2"></textarea>
          </label>
        </div>

        <div class="form-section">
          <h3>코드</h3>
          <label>정답 코드
            <textarea id="fExpectedCode" class="code-textarea auto-resize" rows="2" spellcheck="false"></textarea>
          </label>
        </div>

        <div class="form-section">
          <h3>피드백</h3>
          <label>성공 메시지
            <input type="text" id="fSuccessMessage">
          </label>
          <div class="mascot-row">
            <label class="mascot-select-label">마스코트
              <select id="fMascot">
                <option value="">없음</option>
                <option value="mascot/고드래곤_00_기본.jpg">고드래곤_00_기본.jpg</option>
                <option value="mascot/고드래곤_01_박수.jpg">고드래곤_01_박수.jpg</option>
                <option value="mascot/고드래곤_02_팔짱.jpg">고드래곤_02_팔짱.jpg</option>
                <option value="mascot/고드래곤_03_울음.jpg">고드래곤_03_울음.jpg</option>
                <option value="mascot/고드래곤_04_의문.jpg">고드래곤_04_의문.jpg</option>
                <option value="mascot/고드래곤_05_놀람.jpg">고드래곤_05_놀람.jpg</option>
                <option value="mascot/고드래곤_06_훗.jpg">고드래곤_06_훗.jpg</option>
                <option value="mascot/고드래곤_07_공포.jpg">고드래곤_07_공포.jpg</option>
                <option value="mascot/고드래곤_08_안녕.jpg">고드래곤_08_안녕.jpg</option>
                <option value="mascot/고드래곤_09_아하.jpg">고드래곤_09_아하.jpg</option>
                <option value="mascot/고드래곤_10_하품.jpg">고드래곤_10_하품.jpg</option>
                <option value="mascot/고드래곤_11_따봉.jpg">고드래곤_11_따봉.jpg</option>
                <option value="mascot/기본버전_01_넵.png">기본버전_01_넵.png</option>
                <option value="mascot/기본버전_02_감사.png">기본버전_02_감사.png</option>
                <option value="mascot/기본버전_03_안녕.png">기본버전_03_안녕.png</option>
                <option value="mascot/기본버전_04_축하.png">기본버전_04_축하.png</option>
                <option value="mascot/기본버전_05_알겠습.png">기본버전_05_알겠습.png</option>
                <option value="mascot/기본버전_06_전화.png">기본버전_06_전화.png</option>
                <option value="mascot/기본버전_07_안녕히.png">기본버전_07_안녕히.png</option>
                <option value="mascot/기본버전_08_또만나.png">기본버전_08_또만나.png</option>
                <option value="mascot/기본버전_09_좋은아침.png">기본버전_09_좋은아침.png</option>
                <option value="mascot/기본버전_10_커피.png">기본버전_10_커피.png</option>
                <option value="mascot/기본버전_11_즐퇴.png">기본버전_11_즐퇴.png</option>
                <option value="mascot/기본버전_12_안녕.png">기본버전_12_안녕.png</option>
                <option value="mascot/기본버전_13_바이.png">기본버전_13_바이.png</option>
                <option value="mascot/기본버전_14_졸려.png">기본버전_14_졸려.png</option>
                <option value="mascot/기본버전_15_배고파.png">기본버전_15_배고파.png</option>
                <option value="mascot/기본버전_16_화이팅.png">기본버전_16_화이팅.png</option>
              </select>
            </label>
            <img id="mascotPreview" src="" alt="" class="mascot-preview">
          </div>
          <label>마스코트 대사
            <textarea id="fMascotSpeech" class="auto-resize" rows="2"></textarea>
          </label>
          <label>완료 배지 <span class="field-hint">쉼표로 구분 (선택)</span>
            <input type="text" id="fCompletionBadges" placeholder="첫 창 완성, Lesson 1 완성자">
          </label>
        </div>

        <div class="form-section">
          <div class="section-head">
            <h3>자주 하는 실수</h3>
            <button type="button" id="addErrorBtn">+ 추가</button>
          </div>
          <div id="errorList"></div>
        </div>
      </form>
    </section>
  </main>

  <script src="editor.js"></script>
</body>
</html>
